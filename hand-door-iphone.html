<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>아이폰 손으로 문 열기</title><style>
*{box-sizing:border-box}body{margin:0;background:#151923;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}#camera,#canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#camera{transform:scaleX(-1);opacity:.65}#canvas{touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:12px;right:12px;padding:12px;background:#111b;border-radius:12px;font-size:13px;line-height:1.6}#controls{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:10px;right:10px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}button{border:0;background:white;color:#171717;border-radius:12px;padding:12px;font-size:14px;font-weight:700}button:disabled{opacity:.45}#dot{position:fixed;width:20px;height:20px;border:2px solid #80ffbc;background:#33ff8840;border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%)}#status{font-weight:700}</style></head><body>
<video id="camera" autoplay muted playsinline></video><div id="canvas"></div><div id="dot"></div><div id="hud"><div id="status">모델 준비 중...</div><div>① 카메라 시작 → ② 손 인식 시작 → ③ 초록 점을 문손잡이에 맞추고 엄지·검지를 모으세요 → ④ 손을 좌우로 움직여 문을 여세요.</div><div>※ 카메라 배경 위 3D 실험입니다. 실제 공간 고정 AR은 아닙니다.</div></div><div id="controls"><button id="cameraBtn">카메라 시작</button><button id="handBtn" disabled>손 인식 시작</button><button id="openBtn">문 열기</button><button id="closeBtn">문 닫기</button></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.164.1';
import {GLTFLoader} from 'https://esm.sh/three@0.164.1/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://esm.sh/three@0.164.1/examples/jsm/controls/OrbitControls.js';
const video=document.querySelector('#camera'),dot=document.querySelector('#dot'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.querySelector('#canvas').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.4));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,8,6);scene.add(light);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.01,100);camera.position.set(3.2,2.2,7.8);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.2,0);orbit.enableDamping=true;orbit.update();
let hinge,handle,goal=0,landmarker,tracking=false,grab=false,grabStart=0,grabAngle=0,lastFrame=-1,touchGrab=false;
new GLTFLoader().load('./pavilion-animated-door.glb',g=>{scene.add(g.scene);hinge=g.scene.getObjectByName('EntranceDoor_Hinge');handle=g.scene.getObjectByName('EntranceDoor_Handle');status.textContent=hinge&&handle?'건물 준비 완료. 카메라를 시작하세요.':'문 부품을 찾지 못했습니다.'},undefined,e=>{status.textContent='모델 로딩 실패: HTTPS 사이트에서 실행하세요';console.error(e)});
const clamp=v=>THREE.MathUtils.clamp(v,-Math.PI*95/180,0);
document.querySelector('#openBtn').onclick=()=>goal=-Math.PI*95/180;
document.querySelector('#closeBtn').onclick=()=>goal=0;
document.querySelector('#cameraBtn').onclick=async()=>{try{video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});await video.play();document.querySelector('#handBtn').disabled=false;status.textContent='카메라 켜짐. 손 인식을 시작하세요.'}catch(e){status.textContent='카메라 권한을 확인하세요: '+e.message}};
document.querySelector('#handBtn').onclick=async()=>{try{status.textContent='손 인식 모델 다운로드 중...';const {HandLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');landmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numHands:1});tracking=true;status.textContent='손 인식 중. 손잡이에서 집기 동작을 해보세요.'}catch(e){status.textContent='손 인식 시작 실패: '+e.message;console.error(e)}};
const ray=new THREE.Raycaster(),p=new THREE.Vector2();
function handleScreen(){if(!handle)return null;handle.updateWorldMatrix(true,false);const world=new THREE.Vector3();handle.getWorldPosition(world);world.project(camera);return {x:(world.x+1)*innerWidth/2,y:(1-world.y)*innerHeight/2}}
function detect(){if(!tracking||video.readyState<2||!hinge||!handle)return;const now=performance.now();if(video.currentTime===lastFrame)return;lastFrame=video.currentTime;
let result;try{result=landmarker.detectForVideo(video,now)}catch(e){status.textContent='추적 오류: '+e.message;tracking=false;return}
const lm=result.landmarks?.[0];if(!lm){dot.style.display='none';grab=false;return}
const thumb=lm[4],index=lm[8];const nx=1-(thumb.x+index.x)/2,ny=(thumb.y+index.y)/2;
// The mirrored selfie camera is displayed with object-fit: cover; compensate for crop.
const vw=video.videoWidth,vh=video.videoHeight,scale=Math.max(innerWidth/vw,innerHeight/vh),dw=vw*scale,dh=vh*scale;
const x=(nx*dw-(dw-innerWidth)/2),y=(ny*dh-(dh-innerHeight)/2);
dot.style.display='block';dot.style.left=x+'px';dot.style.top=y+'px';
const pinch=Math.hypot(thumb.x-index.x,thumb.y-index.y);const target=handleScreen();const near=target&&Math.hypot(x-target.x,y-target.y)<Math.max(85,innerWidth*.15);
if(!grab&&pinch<.055&&near){grab=true;grabStart=x;grabAngle=goal;status.textContent='손잡이를 잡았습니다! 손을 좌우로 움직이세요.'}
if(grab){if(pinch>.095){grab=false;status.textContent='손잡이를 놓았습니다.'}else{goal=clamp(grabAngle-(x-grabStart)/innerWidth*3.0)}}
}
const element=renderer.domElement;
element.addEventListener('pointerdown',e=>{if(!handle)return;const r=element.getBoundingClientRect();p.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(p,camera);if(ray.intersectObject(handle,true).length){touchGrab=true;grabStart=e.clientX;grabAngle=goal;orbit.enabled=false;element.setPointerCapture(e.pointerId)}});
element.addEventListener('pointermove',e=>{if(touchGrab)goal=clamp(grabAngle-(e.clientX-grabStart)/innerWidth*3)});
function end(){touchGrab=false;orbit.enabled=true}element.addEventListener('pointerup',end);element.addEventListener('pointercancel',end);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);detect();if(hinge)hinge.rotation.y+=(goal-hinge.rotation.y)*.18;orbit.update();renderer.render(scene,camera)}animate();
</script></body></html>
